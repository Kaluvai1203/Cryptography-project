{% extends "base.html" %}{% block content %}<h2>Audit logs</h2><div class="table-responsive"><table class="table"><tr><th>Time (UTC)</th><th>Actor</th><th>Action</th></tr>{% for l in logs %}<tr><td>{{ l.created_at.strftime('%d-%m-%Y %H:%M:%S') }}</td><td>{{ l.actor }}</td><td>{{ l.action }}</td></tr>{% endfor %}</table></div>{% endblock %}
