{% extends "base.html" %}{% block content %}<h2>Resume and document management</h2><div class="card p-3 mb-4"><form method="post" enctype="multipart/form-data" class="row g-3"><div class="col-md-4"><label class="form-label">Document type</label><select class="form-select" name="category">{% for x in ['Resume','10th Marksheet','12th Marksheet','Degree Certificate','Internship Certificate','Experience Letter','Technical Certificate','Other'] %}<option>{{ x }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label">Choose file (PDF/JPG/PNG, max 8MB)</label><input class="form-control" type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required></div><div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100">Upload document</button></div></form></div><div class="table-responsive"><table class="table"><tr><th>Type</th><th>File</th><th>Uploaded</th><th>Actions</th></tr>{% for d in docs %}<tr><td>{{ d.category }}</td><td>{{ d.original_name }}</td><td>{{ d.uploaded_at.strftime('%d %b %Y') }}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('document_download',doc_id=d.id) }}">Download</a> <form class="d-inline" method="post" action="{{ url_for('document_delete',doc_id=d.id) }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this file?')">Delete</button></form></td></tr>{% else %}<tr><td colspan="4">No documents uploaded.</td></tr>{% endfor %}</table></div>{% endblock %}
