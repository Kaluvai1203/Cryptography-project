{% extends "base.html" %}{% block content %}<h2>Manage job vacancies</h2><div class="card p-3 mb-4"><form method="post"><div class="row g-2"><div class="col-md-6"><input class="form-control" name="title" placeholder="Job title" required></div><div class="col-md-6"><input class="form-control" name="department" placeholder="Department"></div><div class="col-md-6"><input class="form-control" name="location" placeholder="Location"></div><div class="col-md-6"><input class="form-control" name="requirements" placeholder="Required skills"></div><div class="col-12"><textarea class="form-control" name="description" placeholder="Job description"></textarea></div></div><button class="btn btn-primary mt-3">Publish vacancy</button></form></div>{% for j in jobs %}<div class="card mb-2"><div class="card-body d-flex justify-content-between"><div><b>{{ j.title }}</b> — {{ j.department }}<div class="text-muted">{{ j.location }} · {{ 'Active' if j.active else 'Inactive' }}</div></div><form method="post" action="{{ url_for('toggle_job',job_id=j.id) }}"><button class="btn btn-outline-secondary btn-sm">{{ 'Deactivate' if j.active else 'Activate' }}</button></form></div></div>{% endfor %}{% endblock %}
