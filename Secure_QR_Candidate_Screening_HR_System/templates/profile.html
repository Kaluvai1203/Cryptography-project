{% extends "base.html" %}{% block content %}<h2>Candidate profile</h2><form method="post" enctype="multipart/form-data"><div class="card p-3 mb-3"><h5>Personal and contact details</h5><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="dob" value="{{ p.dob or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Gender</label><input class="form-control" type="text" name="gender" value="{{ p.gender or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" type="text" name="phone" value="{{ p.phone or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Street</label><input class="form-control" type="text" name="street" value="{{ p.street or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">City</label><input class="form-control" type="text" name="city" value="{{ p.city or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">State</label><input class="form-control" type="text" name="state" value="{{ p.state or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Country</label><input class="form-control" type="text" name="country" value="{{ p.country or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">PIN code</label><input class="form-control" type="text" name="pincode" value="{{ p.pincode or '' }}"></div></div></div><div class="card p-3 mb-3"><h5>Education details</h5><div class="row"><div class="col-md-6 mb-3"><label class="form-label">College / School</label><input class="form-control" name="college" value="{{ p.college or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Degree</label><input class="form-control" name="degree" value="{{ p.degree or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Department</label><input class="form-control" name="department" value="{{ p.department or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">University</label><input class="form-control" name="university" value="{{ p.university or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Graduation year</label><input class="form-control" name="graduation_year" value="{{ p.graduation_year or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Percentage / CGPA</label><input class="form-control" name="cgpa" value="{{ p.cgpa or '' }}"></div></div></div><div class="card p-3 mb-3"><h5>Professional details and skills</h5><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Company name</label><input class="form-control" name="company" value="{{ p.company or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Job role</label><input class="form-control" name="job_role" value="{{ p.job_role or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Years of experience</label><input class="form-control" name="experience" value="{{ p.experience or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Technical skills (comma separated)</label><input class="form-control" name="skills" value="{{ p.skills or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Profile photo (JPG/PNG)</label><input class="form-control" type="file" name="photo" accept=".jpg,.jpeg,.png"></div></div></div><button class="btn btn-primary">Save profile</button></form>{% endblock %}
