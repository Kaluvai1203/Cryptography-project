{% extends "base.html" %}{% block content %}<h2>Candidate QR scanner</h2><p class="text-muted">Allow camera access and scan a candidate's QR code. The code opens a protected HR verification page.</p><div class="card p-3"><div id="reader" style="max-width:520px"></div><p id="scan-result" class="mt-3"></p></div>{% endblock %}{% block scripts %}<script src="https://unpkg.com/html5-qrcode"></script><script>const scanner=new Html5QrcodeScanner("reader",{fps:10,qrbox:{width:250,height:250}});scanner.render((decoded)=>{document.getElementById("scan-result").innerText="QR detected. Opening verification...";window.location.href=decoded;},()=>{});</script>{% endblock %}
