{% extends "base.html" %}{% block content %}<h2>Schedule interview</h2><div class="card p-3"><p><b>Candidate:</b> {{ application.candidate.name }}<br><b>Position:</b> {{ application.job.title }}</p><form method="post"><label class="form-label">Interview date and time</label><input class="form-control mb-3" type="datetime-local" name="interview_at" required><label class="form-label">Mode</label><select class="form-select mb-3" name="mode"><option>Online</option><option>In-person</option><option>Phone</option></select><label class="form-label">Location / meeting link</label><input class="form-control mb-3" name="location"><label class="form-label">Notes</label><textarea class="form-control mb-3" name="notes"></textarea><button class="btn btn-primary">Confirm schedule</button></form></div>{% endblock %}
